services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: maison
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: maison
    volumes:
      - maison_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maison -d maison"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://maison:${POSTGRES_PASSWORD}@db:5432/maison
      PORT: 3000
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  maison_pg:
