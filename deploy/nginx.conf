# Include inside nginx's http context; TLS terminates at your trusted load balancer.
limit_req_zone $binary_remote_addr zone=maison_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=maison_auth:10m rate=5r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /api/v1/auth/ {
        limit_req zone=maison_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
    location /api/ {
        limit_req zone=maison_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
    location ~* \.(?:js|wasm|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
