# Review deployment only: separate database, sample catalogue and test payments.
# Import this file from the reviewed develop branch, rather than render.yaml.
# Free Postgres expires after 30 days; Render allows one free database/workspace.
services:
  - type: web
    name: maison-munezero-api-sandbox
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/dushimeemma/maison-munezero
    branch: develop
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    # Free web services have no dashboard shell or paid pre-deploy jobs.
    # Migrations are locked and seeds are idempotent; run them before serving.
    dockerCommand: sh -c 'node dist/migrate.js && node dist/seed.js && exec node dist/main.js'
    healthCheckPath: /api/v1/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: development
      - key: SEED_SAMPLE_DATA
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: maison-munezero-sandbox-db
          property: connectionString
      - key: DB_SSL
        value: 'false'
      - key: CORS_ORIGINS
        value: https://maison-munezero-sandbox.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLUTTERWAVE_MODE
        value: test
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        generateValue: true
databases:
  - name: maison-munezero-sandbox-db
    databaseName: maison_sandbox
    user: maison_sandbox
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
    ipAllowList: []
