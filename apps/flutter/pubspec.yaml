name: maison_munezero
description: Maison Munezero shopping, atelier, and operations.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: 1.4.0
  provider: 6.1.5
  flutter_secure_storage: 9.2.4
  uuid: 4.5.1
  intl: 0.20.2
  image_picker: 1.2.0
  pdf: 3.11.3
  printing: 5.14.2
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
  fonts:
    - family: MaisonSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
    - family: MaisonSerif
      fonts:
        - asset: assets/fonts/DejaVuSerif.ttf
