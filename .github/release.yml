changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Security
      labels: [security]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Dependencies
      labels: [dependencies]
    - title: Delivery and infrastructure
      labels: [ci, infrastructure, release]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ['*']
